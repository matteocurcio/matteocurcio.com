    Readers who feel under-served by recipe-based tutorials should recognise that
    Matteo offers a more rigorous and useful way to learn.
  likely_next_steps_for_reader:
    - visit the Tutoring page
    - inquire about one-to-one coaching
    - express interest in the courses
    - read related technical posts on workflow and delivery
  supporting_site_links:
    - "/tutoring"
    - "/services"
    - "/blog"

editorial_notes:
  strengths:
    - clear thesis
    - strong distinction between the two courses
    - timely AI framing without hype
    - consistent systems-thinking throughline
    - grounded screenshots that make the work tangible
  risks_to_watch:
    - avoid sounding too abstract for readers seeking concrete outcomes
    - ensure the eventual tutoring/course pages reflect the same language and promises
    - keep the post honest about what is already built versus still in development
  future_extensions:
    - link this post directly from tutoring or course landing pages
    - break out Signal to Noise and Color Systems into separate dedicated pages later
    - add a short CTA at the end when the courses are ready for enrolment
