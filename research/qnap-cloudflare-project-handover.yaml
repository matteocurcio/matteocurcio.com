admin_backend:
  location: /Users/matteo/Library/Mobile Documents/com~apple~CloudDocs/Code/matteocurcio.com/tools/qnap-admin
  purpose: "Password-protected panel to create/delete users, reset passwords, and provision isolated QNAP access."
  runtime: nodejs
  start_command: "npm start"
  dev_command: "npm run dev"
  listen_port_default: 8787
  required_env:
    - ADMIN_USERNAME
    - ADMIN_PASSWORD_HASH
    - SESSION_SECRET
    - QNAP_HOST
    - QNAP_PORT
    - QNAP_USERNAME
    - QNAP_PASSWORD
  files:
    - package.json
    - server.mjs
    - hash-password.mjs
    - .env.example
    - README.md
  api_actions:
    - POST /api/users/create      # add user + run /share/CACHEDEV1_DATA/remote/provision_isolated_user.sh
    - POST /api/users/password    # reset password via chpasswd
    - POST /api/users/delete      # delete SMB share, remote folder, and user account
    - POST /api/users/provision   # rerun isolation provisioning
    - GET  /api/users/list        # list local users (uid>=1000, excluding admin)
  qnap_commands_used:
    - "adduser -D -h /share/homes/<user> -s /bin/sh -G everyone -p <pass> <user>"
    - "echo '<user>:<pass>' | chpasswd"
    - "/sbin/delshare <user>"
    - "deluser <user>"
    - "/share/CACHEDEV1_DATA/remote/provision_isolated_user.sh <user>"
