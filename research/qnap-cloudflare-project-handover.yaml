qnap:
  host:
    lan_ip: 10.0.60.10
    os: QNAP Linux (5.10.60-qnap)
  web_origin:
    protocol: http
    port: 8080
    validated_by:
      - curl http://127.0.0.1:8080 -> HTTP 200
      - curl http://10.0.60.10:8080 -> HTTP 200

  cloudflared_install:
    binary_path: /share/CACHEDEV1_DATA/.cloudflared/cloudflared
    token_path: /share/CACHEDEV1_DATA/.cloudflared/tunnel.token
    log_path: /share/CACHEDEV1_DATA/.cloudflared/tunnel.log
    watchdog_script: /share/CACHEDEV1_DATA/.cloudflared/ensure-cloudflared.sh
    watchdog_script_content:
      - "#!/bin/sh"
      - "BASE=/share/CACHEDEV1_DATA/.cloudflared"
      - "BIN=\"$BASE/cloudflared\""
      - "TOKEN_FILE=\"$BASE/tunnel.token\""
      - "LOG=\"$BASE/tunnel.log\""
      - "[ -x \"$BIN\" ] || exit 1"
      - "[ -s \"$TOKEN_FILE\" ] || exit 2"
      - "if ps | grep -F \"$BIN tunnel --no-autoupdate run --token\" | grep -v grep >/dev/null 2>&1; then exit 0; fi"
      - "TOKEN=$(cat \"$TOKEN_FILE\")"
      - "\"$BIN\" tunnel --no-autoupdate run --token \"$TOKEN\" >> \"$LOG\" 2>&1 &"
      - "exit 0"
    cron:
      entry: "*/5 * * * * /share/CACHEDEV1_DATA/.cloudflared/ensure-cloudflared.sh >/dev/null 2>&1"
      file: /etc/config/crontab
    running_process_pattern: "/share/CACHEDEV1_DATA/.cloudflared/cloudflared tunnel --no-autoupdate run --token"

  shared_folders_and_access:
    remote_share:
      smb_section: remote
      path: /share/CACHEDEV1_DATA/remote
      browsable: "no"
      valid_users:
        - root
        - administrators
        - admin
      write_list:
        - administrators
        - admin
      invalid_users:
        - guest
        - user1

    user1_share:
      smb_section: user1
      path: /share/CACHEDEV1_DATA/remote/user1
      browsable: "yes"
      public: "no"
      valid_users:
        - root
        - administrators
        - admin
        - user1
      write_list:
        - administrators
        - admin
        - user1
      filesystem_owner: "user1:everyone"
      filesystem_mode: "700"

  user_isolation_automation:
    script_path: /share/CACHEDEV1_DATA/remote/provision_isolated_user.sh
    usage: "/share/CACHEDEV1_DATA/remote/provision_isolated_user.sh <username>"
    script_behavior:
      - Requires existing QTS user
      - Creates /share/CACHEDEV1_DATA/remote/<username>
      - Sets owner to <username>:everyone and chmod 700
      - Creates SMB share [<username>] mapped to that folder
      - Allows access only to root/admin/administrators/<username>
      - Denies that user on other shares: Web, Public, STUDIO, WORKS, BACKUP, PLEX, pbs-replica, remote
      - Restarts SMB service

opnsense:
  required_for_tunnel_mode:
    - No inbound NAT/port-forward to QNAP required
    - Allow outbound from QNAP to internet on tcp/443
    - Allow outbound from QNAP to internet on tcp/udp 7844 (QUIC tunnel transport)
  notes:
    - Tunnel showed healthy edge registrations, indicating outbound path is functioning

